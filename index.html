<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login</title>
    <link rel="stylesheet" href="login.css"/>
  </head>
  <body>
    <div class="box">
      <form id="loginForm" autocomplete="off">
        <div class="title">
          <h1>🙋‍♂️Login</h1> 
        </div>

        <div class="input-box">
          <label for="username" class="label-color">User Name</label>
          <input id="username" name="username" type="text" placeholder="Enter Username" required/>
          <br/>

          <label for="password" class="label-color">Password</label>
          <div class="password-container">
            <input id="password" name="password" type="password" placeholder="Enter Password" required/>
            <button type="button" id="togglePassword" aria-label="Toggle password">👁</button>
          </div>
          <br/>

          <input type="submit" class="Login" value="Login"/>
          <p id="errorMsg" class="error-message"></p>
        </div>
      </form>
    </div>

    <script>
      // Password toggle
      const togglePassword = document.getElementById("togglePassword");
      const passwordField = document.getElementById("password");
      togglePassword.addEventListener("click", () => {
        const type = passwordField.getAttribute("type") === "password" ? "text" : "password";
        passwordField.setAttribute("type", type);
        togglePassword.textContent = type === "password" ? "👁" : "👁️‍🗨️";
      });

      // Demo users (front-end only; not secure for production)
      const validUsers = [
        { username: "naresh", password: "12345678" },
        { username: "sanjai", password: "12345678" },
        { username: "parthiban", password: "12345678" },
        { username: "mani", password: "12345678" },
        { username: "ram", password: "12345678" },
      ];

      // Form submit
      const loginForm = document.getElementById("loginForm");
      const errorMsg = document.getElementById("errorMsg");

      loginForm.addEventListener("submit", function (e) {
        e.preventDefault();
        const username = document.getElementById("username").value.trim().toLowerCase();
        const password = document.getElementById("password").value.trim();
        const userFound = validUsers.find(u => u.username === username && u.password === password);

        if (userFound) {
          errorMsg.textContent = "";
          sessionStorage.setItem("username", username);
          window.location.href = "data.html";
        } else {
          errorMsg.textContent = "❌ Invalid Username or Password";
        }
      });
    </script>
  </body>
</html>
